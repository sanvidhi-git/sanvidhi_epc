[project]
name = "sanvidhi_epc"
authors = [
    { name = "Sanvidhi Tech Pvt. Ltd.", email = "info@sanvidhi.in" },
]
description = "Sanvidhi EPC - BOQ, contractor and client RA billing, measurement, site reporting and plot sales on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
